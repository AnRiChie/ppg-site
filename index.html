<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пульс по камере</title>
<style>
  :root { --bg: #ffffff; --fg: #111111; --muted: #666666; --bad: #dc1829;  /* --bad: saturated red opposite Sber green */ --good: #21a038;  /* --good is Sber green, the one shade used everywhere */ color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --fg: #f2f2f2; --muted: #999999; }
  }
  * { box-sizing: border-box; }
  /* the page is pinned to one screen: fixed rows, nothing scrolls or shifts with text length */
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; position: fixed; inset: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; transition: color 1s; }
  main {
    position: relative; z-index: 1;
    height: 100%; max-width: 480px; margin: 0 auto; padding: 16px;
    display: grid; grid-template-rows: auto 117px minmax(120px, 1fr) auto; justify-items: center; align-items: center; gap: 8px;
    grid-template-columns: 100%;  /* the full-width plot overflows both sides instead of widening the column */
  }
  /* geometry in the 300x300 units of the reference logo. While measuring: a thin round-capped ring
     (r 142.5, width 15) with the camera just under its inner edge; at the end it grows into the logo ring (radii 95-123) */
  .cam { position: relative; width: min(72vw, 40dvh, 320px); aspect-ratio: 1; }
  /* the video is scaled up inside a clipping circle: phone camera frames can carry padded edge rows,
     which showed as thin light lines at the right and bottom */
  .lens { position: absolute; inset: 4.5%; border-radius: 50%; overflow: hidden; background: var(--muted); transform: translateZ(0); transition: opacity .6s; }
  .lens video { display: block; width: 100%; height: 100%; object-fit: cover; transform: scale(1.08); }
  #logo { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #ring { fill: none; stroke: var(--good); stroke-width: 15; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
  #check { fill: var(--good); }
  /* the gap band is squeezed to zero width across the long arm (whose centre line is the band's middle,
     at -36.6deg), so the ring ends part sideways from that line when it opens */
  #gap { transform-box: view-box; transform-origin: 238.3px 98.4px; transform: rotate(-36.6deg) scaleY(0) rotate(36.6deg); }
  /* the delay is when the flood reaches the ring (see finish) */
  #ring, #check { transition: stroke .25s ease .35s, fill .25s ease .35s; }
  /* flat ends while the ring winds into the check: round caps would poke out of the gap */
  body.done #ring { stroke-linecap: butt; }
  #count {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: calc(min(72vw, 40dvh, 320px) * 0.13); font-weight: 700; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 8px rgba(0, 0, 0, .6); transition: opacity .2s;
  }
  /* HR and hints share the row between the camera and the plot: without HR the hint sits in its middle,
     when HR appears it fades in at the top and the hint glides down under it */
  .info { position: relative; width: 100%; height: 100%; }
  #hr {
    position: absolute; left: 0; right: 0; top: 0; text-align: center;
    font-size: 48px; line-height: 64px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums;
    opacity: 0; transition: opacity .5s;
  }
  #hr span { font-size: 18px; font-weight: 400; }
  .info.has-hr #hr { opacity: 1; }
  body.done .info #hr { opacity: 0; }
  #hr.live { color: var(--muted); }
  #msg {
    position: absolute; left: 0; right: 0; top: 0; transform: translateY(36px); transition: transform .6s ease;
    height: 3em; overflow: hidden; color: var(--muted); text-align: center; font-size: 15px; line-height: 1.5em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .info.has-hr #msg { transform: translateY(72px); }
  /* the plot runs from the left to the right edge of the screen */
  .plot { position: relative; width: 100vw; height: 100%; }
  .plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity .5s; }
  /* aurora: low-res quality colours stretched and blurred. The canvas itself fades to transparent at top
     and bottom (see draw), so the blur never meets an opaque edge (that showed as bright frames); it overhangs
     the plot by AURORA_PX per side so the blur's own fade at the left and right stays off-screen */
  #aurora { left: -80px; width: calc(100% + 160px); top: -24px; height: calc(100% + 48px); filter: blur(20px); }
  .buttons { display: flex; gap: 12px; }
  button { font: inherit; padding: 12px 24px; border-radius: 24px; border: 2px solid var(--fg); background: var(--bg); color: var(--fg); }
  button.on { background: var(--fg); color: var(--bg); }
  /* "Ещё раз" only on the result screen; hidden by visibility so the layout doesn't move */
  #start { visibility: hidden; }
  #start.shown { visibility: visible; }
  body.done #torch { display: none; }

  /* ---- finale (body.done): aurora floods the screen, the logo is drawn and turns white, results come in ---- */
  #glow { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  #band { position: absolute; left: -15%; width: 130%; background: var(--good); filter: blur(32px); opacity: 0; }
  #sky {
    position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease .7s;
    background:
      radial-gradient(120% 80% at 0% 0%, #1e8fe0 0%, rgba(30, 143, 224, 0) 60%),
      radial-gradient(120% 80% at 0% 100%, #e8e43a 0%, rgba(232, 228, 58, 0) 60%),
      var(--good);
  }
  body.done #sky { opacity: 1; }
  body.done .lens, body.done #count, body.done .plot canvas { opacity: 0; }
  body.done #ring { stroke: #fff; }
  body.done #check { fill: #fff; }
  body.done, body.done #msg { color: #fff; }
  body.done button { border-color: #fff; background: transparent; color: #fff; }
  #result { position: fixed; inset: 0; z-index: 2; pointer-events: none; color: #fff; }
  /* #done and #hrbox are centred on --mid; `translate` composes with the animated `transform` */
  #done, #hrbox { position: absolute; left: 0; right: 0; top: var(--mid, 50%); translate: 0 -50%; text-align: center; opacity: 0; }
  #done { font-size: 64px; font-weight: 800; }
  #hrbox span { display: block; font-size: 18px; opacity: .9; }
  #hrbox b { display: block; font-size: 88px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
  /* results on the border of the lower third of the screen */
  #stats { position: absolute; left: 16px; right: 16px; top: 66.667%; display: flex; gap: 12px; }
  #stats div { flex: 1; text-align: center; opacity: 0; }
  #stats b { display: block; font-size: 30px; line-height: 1.2; }
  #stats span { font-size: 14px; opacity: .85; }
  /* above the flood (#glow, earlier in the page), under the logo and the texts */
  .spark { position: fixed; z-index: 0; pointer-events: none; border-radius: 50%; }
</style>
</head>
<body>
<div id="glow"><div id="band"></div><div id="sky"></div></div>
<main>
  <div class="cam">
    <div class="lens"><video playsinline muted></video></div>
    <!-- the ring fills with the clean signal collected; at the end the check is drawn and the ring opens
         where the check's long arm meets it. Coordinates are those of the 300x300 reference picture. -->
    <svg id="logo" viewBox="0 0 300 300">
      <defs>
        <!-- the gap: a band parallel to the long arm, both ring ends are cut along it -->
        <mask id="gapMask" maskUnits="userSpaceOnUse" x="-20" y="-20" width="340" height="340">
          <rect x="-20" y="-20" width="340" height="340" fill="#fff"></rect>
          <polygon id="gap" points="238,153 325,88 259,29 195,77" fill="#000"></polygon>
        </mask>
        <!-- the part of the check behind the drawing front (see setPen) -->
        <mask id="penMask" maskUnits="userSpaceOnUse" x="-20" y="-20" width="340" height="340">
          <polygon id="pen" points="-20,-20 -20,-20 -20,320 -20,320" fill="#fff"></polygon>
        </mask>
      </defs>
      <g mask="url(#gapMask)">
        <circle id="ring" cx="150" cy="150" r="142.5" pathLength="1" transform="rotate(-90 150 150)"></circle>
      </g>
      <!-- the long arm's edges run out to the ring's outer circle (r 123) and its tip follows that circle -->
      <path id="check" d="M104 118 L150 147 L247.3 74.8 A123 123 0 0 1 261.7 98.7 L150 181 L104 152 Z" mask="url(#penMask)"></path>
    </svg>
    <div id="count"></div>
  </div>
  <div class="info">
    <div id="hr"></div>
    <div id="msg">Приложите палец к камере, чтобы начать</div>
  </div>
  <div class="plot"><canvas id="aurora" width="64" height="32"></canvas><canvas id="plot"></canvas></div>
  <div class="buttons">
    <button id="start">Ещё раз</button>
    <button id="torch" class="on" hidden>Вспышка</button>
  </div>
</main>
<div id="result">
  <div id="done">Готово!</div>
  <div id="hrbox"><span>ЧСС</span><b id="hrval"></b><span>уд/мин</span></div>
  <div id="stats">
    <div><b id="cv"></b><span>CV, %</span></div>
    <div><b id="amo"></b><span>AMo, %</span></div>
    <div><b id="rmssd"></b><span>RMSSD, мс</span></div>
  </div>
</div>
<!-- bump ?v= after editing ppg.js: phones keep the old copy otherwise -->
<script src="ppg.js?v=10"></script>
<script>
const video = document.querySelector('video');
const plot = document.getElementById('plot'), aurora = document.getElementById('aurora');
const ring = document.getElementById('ring'), countEl = document.getElementById('count');
const AURORA_PX = 80;  // must match #aurora's overhang in CSS
let shown = 0, shownAt = 0, display = 0;  // progress interpolation between the 0.5 s quality steps
const hrEl = document.getElementById('hr'), msgEl = document.getElementById('msg'), info = document.querySelector('.info');
const startBtn = document.getElementById('start'), torchBtn = document.getElementById('torch');
const grab = document.createElement('canvas');
grab.width = 80; grab.height = 60;
const gctx = grab.getContext('2d', { willReadFrequently: true });
let stream = null, meter = null;

const cam = document.querySelector('.cam'), band = document.getElementById('band');
const pen = document.getElementById('pen'), gap = document.getElementById('gap');
const resultEl = document.getElementById('result'), doneEl = document.getElementById('done'), hrBox = document.getElementById('hrbox');
const statItems = [...document.getElementById('stats').children];

// Finale, ms from the moment the ring is full: the flood reaches the full thin ring and it turns white (CSS);
// from L0 the logo: check drawn L0+0-675, its long arm breaks the ring at L0+555; L0+555-1005 the thin ring is
// wiped (and fades) from the gap's lower edge clockwise round to its upper edge; L0+1005-2805 the logo-width
// ring grows the same way; the logo swells and settles back L0+1795-3010, peaking as the ring nearly closes;
// sparkles + "Готово!" from L0+2765, "Готово!" leaves at L0+4465, HR and CV / AMo / RMSSD from L0+4765.
const ARM = 0.165;  // where the long arm crosses the ring, share of the turn clockwise from the top
const L0 = 650;     // the logo starts once the flood has turned the ring white
function finish() {
  setRing(1);
  setMsg('');
  // pathLength is 1: dash "len 1-len" starting at -offset; "1 0" is the full ring. Both dashes have their
  // fixed end inside the gap, so only the moving end shows: the thin ring's start runs a full turn clockwise.
  ring.animate([
    { strokeDasharray: '1 0', strokeDashoffset: -ARM, strokeOpacity: 1 },
    { strokeDasharray: '0 1', strokeDashoffset: -ARM - 1, strokeOpacity: 0.3 },
  ], { duration: 450, delay: L0 + 555, easing: 'cubic-bezier(.5, 0, .7, 1)', fill: 'forwards' });
  ring.animate([
    { r: '109px', strokeWidth: '28px', strokeDasharray: '0 1', strokeDashoffset: -ARM, strokeOpacity: 1 },
    { r: '109px', strokeWidth: '28px', strokeDasharray: '1 0', strokeDashoffset: -ARM, strokeOpacity: 1 },
  ], { duration: 1800, delay: L0 + 1005, easing: 'cubic-bezier(.35, .2, .25, 1)', fill: 'forwards' });
  const box = document.querySelector('.plot').getBoundingClientRect();
  band.style.top = box.top + 'px';
  band.style.height = box.height + 'px';
  const fill = 2.4 * innerHeight / box.height;  // tall enough to cover the screen from any band position
  band.animate([{ opacity: 0.9, transform: 'scaleY(1)' }, { opacity: 1, transform: `scaleY(${fill})` }],
    { duration: 1400, easing: 'cubic-bezier(.45, 0, .2, 1)', fill: 'forwards' });
  document.body.classList.add('done');
  drawCheck(pen.animate([{ opacity: 1 }, { opacity: 1 }],
    { duration: 675, delay: L0, easing: 'cubic-bezier(.42, 0, .58, 1)', fill: 'forwards' }));
  gap.animate([
    { transform: 'rotate(-36.6deg) scaleY(0) rotate(36.6deg)' },
    { transform: 'rotate(-36.6deg) scaleY(1) rotate(36.6deg)' },
  ], { duration: 180, delay: L0 + 555, easing: 'cubic-bezier(.2, .7, .3, 1)', fill: 'forwards' });
  cam.animate([
    { transform: 'scale(1)', easing: 'cubic-bezier(.4, 0, .6, 1)' },
    { transform: 'scale(1.1)', offset: 0.65, easing: 'cubic-bezier(.4, 0, .4, 1)' },
    { transform: 'scale(1)' },
  ], { duration: 1215, delay: L0 + 1795 });
  setTimeout(sparkles, L0 + 2765);
  // "Готово!" and the HR share the point halfway between the logo and the results line (2/3 of the screen)
  resultEl.style.setProperty('--mid', (cam.getBoundingClientRect().bottom + innerHeight * 2 / 3) / 2 + 'px');
  doneEl.animate([
    { opacity: 0, transform: 'scale(1.6)' },
    { opacity: 1, transform: 'scale(0.94)', offset: 0.7 },
    { opacity: 1, transform: 'scale(1)' },
  ], { duration: 700, delay: L0 + 2765, easing: 'cubic-bezier(.2, .7, .3, 1)', fill: 'forwards' });
  doneEl.animate([{ opacity: 1 }, { opacity: 0, transform: 'scale(0.9)' }], { duration: 300, delay: L0 + 4465, fill: 'forwards' });
  const h = meter.hrv, fmt = (v, d) => (h ? v.toFixed(d) : '—');
  document.getElementById('hrval').textContent = Math.round(meter.hr);
  document.getElementById('cv').textContent = fmt(h && h.cv, 1);
  document.getElementById('amo').textContent = fmt(h && h.amo * 100, 0);
  // RMSSD only when the 20% rule dropped <= 10% of intervals; approximate (camera reads ~1.7x the device)
  const rmssdEl = document.getElementById('rmssd');
  rmssdEl.textContent = h && h.rmssdOk ? '≈' + h.rmssd.toFixed(0) : '—';
  rmssdEl.nextElementSibling.textContent = h && !h.rmssdOk ? 'RMSSD: сигнал недостаточно чистый' : 'RMSSD, мс';
  const rise = [{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }];
  hrBox.animate(rise, { duration: 500, delay: L0 + 4765, easing: 'ease-out', fill: 'forwards' });
  statItems.forEach((el, k) => el.animate(rise, { duration: 500, delay: L0 + 4965 + 120 * k, easing: 'ease-out', fill: 'forwards' }));
  startBtn.classList.add('shown');
}

// The check is revealed behind a straight front across its width: on the short arm the front is vertical
// (as the arm's end and the joint between the arms), on the long arm it turns to the tip's chord.
// It follows the eased progress of `anim` (a placeholder animation on the mask), so cancelling that stops it.
const CHECK_A = [104, 135], CHECK_B = [150, 164], CHECK_C = [254.5, 86.75];  // centre line: end, joint, tip
const CHECK_TURN = Math.atan2(14.4, 23.9);  // tip chord (247.3,74.8)-(261.7,98.7) from vertical
function setPen(q) {
  const ls = Math.hypot(CHECK_B[0] - CHECK_A[0], CHECK_B[1] - CHECK_A[1]);
  const ll = Math.hypot(CHECK_C[0] - CHECK_B[0], CHECK_C[1] - CHECK_B[1]);
  const s = q * (ls + ll), long = s > ls, u = long ? (s - ls) / ll : s / ls;
  const [p0, p1] = long ? [CHECK_B, CHECK_C] : [CHECK_A, CHECK_B], ang = long ? u * CHECK_TURN : 0;
  const px = p0[0] + (p1[0] - p0[0]) * u, py = p0[1] + (p1[1] - p0[1]) * u;
  const dx = 60 * Math.sin(ang), dy = 60 * Math.cos(ang);
  // everything left of the front; at the end everything (the tip's arc bulges past its chord)
  pen.setAttribute('points', q <= 0 ? '-20,-20 -20,-20 -20,320 -20,320'  // nothing, not even an edge hairline
    : q >= 1 ? '-20,-20 320,-20 320,320 -20,320'
    : `-20,-20 ${px - dx},${py - dy} ${px + dx},${py + dy} -20,320`);
}
function drawCheck(anim) {
  const step = () => {
    if (anim.playState === 'idle') return setPen(0);
    setPen(anim.effect.getComputedTiming().progress ?? 0);
    if (anim.playState !== 'finished') requestAnimationFrame(step);
  };
  step();
}

// Round sparkles in the gradient's colours burst from behind the logo, are slowed by the air and fall,
// fading out. Path of a body with linear drag k and gravity g, sampled into keyframes. Start points across
// the whole disc, start times, speeds and drag all differ, so the cloud doesn't keep the ring's shape.
const SPARK_COLORS = ['#ffffff', '#3fb0ff', '#f5ef55', 'var(--good)'];
function sparkles() {
  const r = cam.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, rad = r.width * 0.36;
  const g = 700;  // px/s²
  for (let n = 0; n < 130; n++) {
    const a = Math.random() * 2 * Math.PI, d = rad * Math.sqrt(Math.random()), size = 3 + Math.random() * 6;
    const b = a + (Math.random() - 0.5) * 1.2, v = 120 + Math.random() * 420, k = 1.6 + Math.random() * 1.8;
    const vx = Math.cos(b) * v, vy = Math.sin(b) * v - 50 - Math.random() * 200, dur = 1.6 + Math.random() * 1.4;
    const s = document.createElement('div');
    s.className = 'spark';
    Object.assign(s.style, {
      left: cx + Math.cos(a) * d - size / 2 + 'px', top: cy + Math.sin(a) * d - size / 2 + 'px',
      width: size + 'px', height: size + 'px', background: SPARK_COLORS[n % SPARK_COLORS.length],
    });
    document.body.appendChild(s);
    const frames = [];
    for (let i = 0; i <= 24; i++) {
      const t = dur * i / 24, e = (1 - Math.exp(-k * t)) / k;
      frames.push({
        transform: `translate(${vx * e}px, ${vy * e + g / k * (t - e)}px) scale(${1 - 0.4 * i / 24})`,
        opacity: i === 0 ? 0 : i < 10 ? 1 : 1 - (i - 10) / 14,
      });
    }
    s.animate(frames, { duration: dur * 1000, delay: Math.random() * 350, fill: 'both' })
      .finished.then(() => s.remove(), () => s.remove());
  }
}

// back to the measuring screen
function resetFinale() {
  document.body.classList.remove('done');
  [band, ring, pen, gap, cam, doneEl, hrBox, ...statItems].forEach(el => el.getAnimations().forEach(a => a.cancel()));
  setPen(0);
  document.querySelectorAll('.spark').forEach(s => s.remove());
}

// Hint line: a new text fades the old one out and itself in
let msgText = msgEl.textContent;
function setMsg(text) {
  if (text === msgText) return;
  msgText = text;
  msgEl.getAnimations().forEach(a => a.cancel());
  msgEl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 250, fill: 'forwards' }).finished.then(() => {
    msgEl.textContent = msgText;
    msgEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 350, fill: 'forwards' });
  }, () => {});
}

// finger on the lens with the flash on: the picture is mostly red. Once recording, the finger counts as
// taken away only below 90% of that ratio, so a borderline picture doesn't flip back and forth.
const fingerOn = (r, g, b, k = 1) => r > 40 && r > 1.6 * k * Math.max(g, b);
let fingerAt = 0;  // when the finger was detected and the recording started, ms
let offFrames = 0; // consecutive frames without the finger while recording
let failAt = 0;    // when the last attempt failed, ms; 0 = no failed attempt pending
let armed = true;  // after a failure a new attempt waits until the finger has been lifted

const MSG_PLACE = 'Приложите палец к камере, чтобы начать', MSG_HOLD = 'Держите палец неподвижно';
const MSG_MOVE = 'Попробуйте поменять положение пальца или руки';

// back to waiting for the finger: no recording, empty ring and plot
function resetRecording() {
  meter = null;
  finishing = false;
  shown = display = lastNow = 0;
  viewT = drawAt = introAt = yLo = yHi = 0; sigN = -1; dv = []; dsm = []; dq = [];
  setRing(0);
  hrEl.textContent = '';
  info.classList.remove('has-hr');
  draw();
}

// The camera starts by itself (and again from "Ещё раз"); the measurement starts when a finger covers it
async function start() {
  stop();
  resetFinale();
  resetRecording();
  failAt = 0;
  armed = true;
  startBtn.classList.remove('shown');
  if (!navigator.mediaDevices) { setMsg('Камера доступна только по HTTPS или с localhost'); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } },
      audio: false,
    });
  } catch (e) {
    setMsg('Нет доступа к камере: ' + e.message);
    return;
  }
  video.srcObject = stream;
  await video.play();
  const track = stream.getVideoTracks()[0];
  torchBtn.hidden = !(track.getCapabilities && track.getCapabilities().torch);
  setTorch(torchBtn.classList.contains('on'));
  setMsg(MSG_PLACE);
  nextFrame();
}

function stop() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
}

function setTorch(on) {
  torchBtn.classList.toggle('on', on);
  if (stream && !torchBtn.hidden) stream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: on }] }).catch(() => {});
}

// p in 0..1; an empty ring is hidden so nothing shows at zero. Also the countdown in the camera.
function setRing(p) {
  p = Math.min(1, p);
  ring.style.strokeDashoffset = 1 - p;
  ring.style.strokeDasharray = p >= 1 ? 'none' : '';  // a full dash still leaves a hairline seam at its start
  ring.style.opacity = p > 0 ? 1 : 0;
  countEl.textContent = meter ? (MIN_RUN_SEC * (1 - p)).toFixed(2) : '';  // only while recording
}

// Green time shown to the user: the meter updates it every 0.5 s, in between it creeps on in real time
// while the newest step is green (at most up to the next step), and it never goes back unless the run resets.
// Forward jumps (revised SNR joins two green pieces) are eased out over ~0.5 s instead of snapping.
let lastNow = 0;
function progress(now) {
  const dt = lastNow ? Math.min(0.1, (now - lastNow) / 1000) : 0;
  lastNow = now;
  if (meter.shown !== shown) { shown = meter.shown; shownAt = now; }
  if (shown === 0) return (display = 0);
  const creep = meter.green ? Math.min(STEP_SEC, (now - shownAt) / 1000) : 0;
  const target = Math.min(shown + creep, MIN_RUN_SEC), lag = target - display;
  if (lag > 0) display += Math.min(lag, Math.max(dt, lag * dt / 0.5));
  return display;
}

function nextFrame() {
  if ('requestVideoFrameCallback' in video) video.requestVideoFrameCallback(onFrame);
  else requestAnimationFrame(now => onFrame(now));
}

function onFrame(now, meta) {
  if (!stream) return;
  gctx.drawImage(video, 0, 0, grab.width, grab.height);
  const d = gctx.getImageData(0, 0, grab.width, grab.height).data;
  let r = 0, g = 0, b = 0;
  for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
  const px = d.length / 4;
  r /= px; g /= px; b /= px;
  // the recording starts only once the finger covers the camera
  if (!meter) {
    if (failAt) {
      // after a failed attempt: its message, then "try again"; the next attempt needs the finger lifted first
      if (now - failAt > 2500) setMsg('Попробуйте снова');
      if (!fingerOn(r, g, b, 0.9)) armed = true;
    }
    if (!armed || !fingerOn(r, g, b)) { nextFrame(); return; }
    meter = new PpgMeter();
    fingerAt = now;
    offFrames = 0;
    failAt = 0;
  } else if (!fingerOn(r, g, b, 0.9) && ++offFrames >= 5) {
    // finger taken away (5 frames, ~0.17 s, so one odd frame doesn't count): drop the recording and wait again
    resetRecording();
    setMsg(MSG_PLACE);
    nextFrame();
    return;
  } else if (fingerOn(r, g, b, 0.9)) offFrames = 0;
  // captureTime is the real camera timestamp (Chrome); fall back to callback time
  meter.push(((meta && meta.captureTime) || now) / 1000, r, g, b);
  if (meter.hr !== null) {
    // the ring first fills up at its own pace, then render() starts the finale from the full ring
    stop();
    finishing = true;
  } else if (meter.failed) {
    // 30 s in a row without a good signal; the camera stays on for the next attempt
    resetRecording();
    failAt = now;
    armed = false;
    setMsg('Не удалось записать качественный сигнал');
    nextFrame();
  } else {
    // provisional HR over the run collected so far, greyed until the full interval is reached
    // (the last value stays while it fades out)
    hrEl.classList.add('live');
    if (meter.liveHr !== null) hrEl.innerHTML = Math.round(meter.liveHr) + '<span> уд/мин</span>';
    info.classList.toggle('has-hr', meter.liveHr !== null);
    // the "change position" hint shows for 4 s at 10 and 20 s without a good signal, then the usual line again
    const bad = meter.badSec, hint = (bad >= 10 && bad < 14) || (bad >= 20 && bad < 24);
    setMsg(hint ? MSG_MOVE : now - fingerAt < 3000 ? 'Примите комфортное положение' : MSG_HOLD);
    nextFrame();
  }
}

// Quality colour as in full_refine: red -> background -> green, TwoSlopeNorm(0.4*thr, thr, 1.5*thr)
function qualityColor(q, bg, bad, good) {
  const thr = meter.thr, lo = thr * 0.4, hi = thr * 1.5;
  q = Math.min(hi, Math.max(lo, q));
  const [from, to, a] = q < thr ? [bad, bg, (q - lo) / (thr - lo)] : [bg, good, (q - thr) / (hi - thr)];
  return `rgb(${from.map((c, i) => Math.round(c + (to[i] - c) * a)).join(',')})`;
}

function hexRgb(name) {
  const h = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
}

// The plot is drawn on the screen's frame clock, not the camera's (camera frames come unevenly, 0-2 samples each).
// Its time axis runs at a steady pace PLOT_LAG behind the newest sample. Every drawn value (signal, smoothed
// curve, quality) and the vertical scale ease toward what the meter computes, so the 0.5 s bound and quality
// updates and the still-settling newest samples glide instead of jumping.
const PLOT_LAG = 0.2;  // s
const auroraFade = aurora.getContext('2d').createLinearGradient(0, 0, 0, aurora.height);
[[0, 0], [0.2, 0.25], [0.38, 0.85], [0.5, 1], [0.62, 0.85], [0.8, 0.25], [1, 0]]
  .forEach(([at, a]) => auroraFade.addColorStop(at, `rgba(0,0,0,${a})`));
const INTRO_MS = 1400, START_FADE = 1;  // plot floating in from the right; soft front over the first 1 s, s
let viewT = 0, drawAt = 0, yLo = 0, yHi = 0, introAt = 0;
let sigN = -1, sigs = null;   // plotSignals cached for meter.n
let dv = [], dsm = [], dq = []; // eased signal, smoothed curve and quality by sample index

let finishing = false;  // HR is ready, the ring is still filling up to full
function render(now) {
  requestAnimationFrame(render);
  if (!meter || !(stream || finishing)) return;
  const p = progress(now) / MIN_RUN_SEC;
  setRing(p);
  draw(now);
  if (finishing && p >= 1) { finishing = false; finish(); }
}
requestAnimationFrame(render);

function draw(now) {
  const dpr = window.devicePixelRatio || 1;
  const w = plot.clientWidth * dpr, h = plot.clientHeight * dpr;
  if (plot.width !== w || plot.height !== h) { plot.width = w; plot.height = h; }
  const ctx = plot.getContext('2d'), actx = aurora.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  actx.clearRect(0, 0, aurora.width, aurora.height);
  if (!meter || meter.b1 === null) return;
  if (sigN !== meter.n) { sigs = meter.plotSignals(); sigN = meter.n; }
  const [sig, smooth] = sigs, s0 = sigN - sig.length, n = meter.n;
  const dt = drawAt ? Math.min(0.1, (now - drawAt) / 1000) : 0;
  drawAt = now;
  // steady clock nudged toward the newest sample; snaps after a stall. On the first frame the view's right
  // edge is at the recording's start, then for INTRO_MS it eases out to its place: the plot floats in from the right.
  const head = meter.t0 + (n - 1) / FS, aim = head - PLOT_LAG;
  if (!introAt) introAt = now;
  const intro = Math.min(1, (now - introAt) / INTRO_MS);
  if (intro < 1) viewT = meter.t0 + (aim - meter.t0) * (1 - (1 - intro) ** 3);
  else viewT = Math.abs(aim - viewT) < 0.5 ? viewT + dt + (aim - viewT) * Math.min(1, 2 * dt) : aim;
  viewT = Math.min(viewT, head);
  const x = i => w - (viewT - meter.t0 - i / FS) * w / BUF_SEC;  // i: sample index
  const a = dt ? 1 - Math.exp(-dt / 0.15) : 1;
  const ease = (arr, i, v) => { arr[i] = arr[i] === undefined || !dt ? v : arr[i] + (v - arr[i]) * a; };
  for (let k = 0; k < sig.length; k++) { ease(dv, s0 + k, sig[k]); ease(dsm, s0 + k, smooth[k]); }
  // Aurora: low-res columns coloured by the (eased) quality at their time. Samples whose quality is not
  // known yet (the newest step) take the newest known value; before the recording's start it fades out over
  // START_FADE, like the curve, so both come in from the right with a soft front.
  const bg = hexRgb('--bg'), bad = hexRgb('--bad'), good = hexRgb('--good');
  let last = n - 1;
  while (last >= 0 && !(meter.quality(last) >= 0)) last--;
  if (last >= 0) {
    for (let i = Math.max(0, s0); i < n; i++) ease(dq, i, meter.quality(Math.min(i, last)));
    const ext = AURORA_PX / plot.clientWidth;
    for (let c = 0; c < aurora.width; c++) {
      const f = (c + 0.5) / aurora.width * (1 + 2 * ext) - ext;  // position in plot widths
      const fi = Math.min(n - 1, Math.max(Math.max(0, s0), (viewT - BUF_SEC * (1 - f) - meter.t0) * FS));
      const i = Math.floor(fi), j = Math.min(n - 1, i + 1);
      actx.globalAlpha = Math.min(1, Math.max(0, (viewT - BUF_SEC * (1 - f) - meter.t0) / START_FADE));
      actx.fillStyle = qualityColor(dq[i] + (dq[j] - dq[i]) * (fi - i), bg, bad, good);
      actx.fillRect(c, 0, 1, aurora.height);
    }
    actx.globalAlpha = 1;
    // soft vertical falloff to fully transparent rows at top and bottom
    actx.globalCompositeOperation = 'destination-in';
    actx.fillStyle = auroraFade;
    actx.fillRect(0, 0, aurora.width, aurora.height);
    actx.globalCompositeOperation = 'source-over';
  }
  // vertical scale from the visible part; while floating in, from all of it, so it doesn't jump as it enters
  let min = Infinity, max = -Infinity;
  for (let i = s0; i < n; i++) {
    const xi = x(i);
    if (intro < 1 || (xi >= 0 && xi <= w)) { min = Math.min(min, dv[i]); max = Math.max(max, dv[i]); }
  }
  if (min < max) {
    const b = yHi > yLo ? a : 1;
    yLo += (min - yLo) * b; yHi += (max - yHi) * b;
  }
  const y = v => h * 0.8 - (v - yLo) / (yHi - yLo || 1) * h * 0.6;
  const line = (data, color, width, alpha) => {
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = width * dpr;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let i = s0; i < n; i++) (i > s0 ? ctx.lineTo : ctx.moveTo).call(ctx, x(i), y(data[i]));
    ctx.stroke();
    ctx.globalAlpha = 1;
  };
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name);
  line(dv, css('--muted'), 1, 0.45);
  line(dsm, css('--fg'), 4, 1);
  // soft front at the recording's start
  const xa = x(0), xb = x(START_FADE * FS);
  if (xb > 0) {
    const fade = ctx.createLinearGradient(xa, 0, xb, 0);
    fade.addColorStop(0, 'rgba(0,0,0,0)');
    fade.addColorStop(1, 'rgba(0,0,0,1)');
    ctx.globalCompositeOperation = 'destination-in';
    ctx.fillStyle = fade;
    ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'source-over';
  }
}

setRing(0);
startBtn.onclick = start;
start();
torchBtn.onclick = () => setTorch(!torchBtn.classList.contains('on'));
</script>
</body>
</html>
