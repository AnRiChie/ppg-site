<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пульс по камере</title>
<style>
  :root { --bg: #ffffff; --fg: #111111; --muted: #666666; --bad: #e53935; --good: #43a047; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --fg: #f2f2f2; --muted: #999999; }
  }
  * { box-sizing: border-box; }
  /* the page is pinned to one screen: fixed rows, nothing scrolls or shifts with text length */
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; position: fixed; inset: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; }
  main {
    height: 100%; max-width: 480px; margin: 0 auto; padding: 16px;
    display: grid; grid-template-rows: auto 64px 3em minmax(120px, 1fr) auto; justify-items: center; align-items: center; gap: 8px;
  }
  .cam { position: relative; width: min(60vw, 34dvh, 260px); aspect-ratio: 1; }
  .cam video { position: absolute; inset: 7%; width: 86%; height: 86%; border-radius: 50%; object-fit: cover; }
  .cam svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .cam circle { fill: none; stroke-width: 4; }
  #ring { stroke: var(--good); stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .3s; }
  #hr { font-size: 48px; line-height: 64px; font-weight: 700; white-space: nowrap; }
  #msg {
    height: 3em; overflow: hidden; color: var(--muted); text-align: center; font-size: 15px; line-height: 1.5em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .plot { position: relative; width: 100%; height: 100%; }
  .plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* aurora: low-res quality colours stretched and blurred, fading out at every edge */
  #aurora {
    filter: blur(8px);
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 30%, #000 70%, transparent), linear-gradient(to right, transparent, #000 12%, #000 88%, transparent);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(to bottom, transparent, #000 30%, #000 70%, transparent), linear-gradient(to right, transparent, #000 12%, #000 88%, transparent);
    mask-composite: intersect;
  }
  .buttons { display: flex; gap: 12px; }
  button { font: inherit; padding: 12px 24px; border-radius: 24px; border: 2px solid var(--fg); background: var(--bg); color: var(--fg); }
  button.on { background: var(--fg); color: var(--bg); }
</style>
</head>
<body>
<main>
  <div class="cam">
    <video playsinline muted></video>
    <!-- green ring: share of the clean signal collected for the HR -->
    <svg viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="47" stroke="var(--muted)" opacity="0.25"></circle>
      <circle id="ring" cx="50" cy="50" r="47" pathLength="1"></circle>
    </svg>
  </div>
  <div id="hr"></div>
  <div id="msg">Закройте пальцем заднюю камеру и нажмите «Старт»</div>
  <div class="plot"><canvas id="aurora" width="64" height="16"></canvas><canvas id="plot"></canvas></div>
  <div class="buttons">
    <button id="start">Старт</button>
    <button id="torch" class="on" hidden>Вспышка</button>
  </div>
</main>
<!-- bump ?v= after editing ppg.js: phones keep the old copy otherwise -->
<script src="ppg.js?v=3"></script>
<script>
const video = document.querySelector('video');
const plot = document.getElementById('plot'), aurora = document.getElementById('aurora');
const ring = document.getElementById('ring');
const hrEl = document.getElementById('hr'), msgEl = document.getElementById('msg');
const startBtn = document.getElementById('start'), torchBtn = document.getElementById('torch');
const grab = document.createElement('canvas');
grab.width = 80; grab.height = 60;
const gctx = grab.getContext('2d', { willReadFrequently: true });
let stream = null, meter = null;

async function start() {
  stop();
  hrEl.textContent = '';
  setRing(0);
  if (!navigator.mediaDevices) { msgEl.textContent = 'Камера доступна только по HTTPS или с localhost'; return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } },
      audio: false,
    });
  } catch (e) {
    msgEl.textContent = 'Нет доступа к камере: ' + e.message;
    return;
  }
  video.srcObject = stream;
  await video.play();
  const track = stream.getVideoTracks()[0];
  torchBtn.hidden = !(track.getCapabilities && track.getCapabilities().torch);
  setTorch(torchBtn.classList.contains('on'));
  meter = new PpgMeter();
  startBtn.textContent = 'Стоп';
  nextFrame();
}

function stop() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  startBtn.textContent = 'Старт';
}

function setTorch(on) {
  torchBtn.classList.toggle('on', on);
  if (stream && !torchBtn.hidden) stream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: on }] }).catch(() => {});
}

// p in 0..1; an empty ring is hidden so the round cap doesn't leave a dot
function setRing(p) {
  ring.style.strokeDashoffset = 1 - Math.min(1, p);
  ring.style.opacity = p > 0 ? 1 : 0;
}

function nextFrame() {
  if ('requestVideoFrameCallback' in video) video.requestVideoFrameCallback(onFrame);
  else requestAnimationFrame(now => onFrame(now));
}

function onFrame(now, meta) {
  if (!stream) return;
  gctx.drawImage(video, 0, 0, grab.width, grab.height);
  const d = gctx.getImageData(0, 0, grab.width, grab.height).data;
  let r = 0, g = 0, b = 0;
  for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
  const px = d.length / 4;
  // captureTime is the real camera timestamp (Chrome); fall back to callback time
  meter.push(((meta && meta.captureTime) || now) / 1000, r / px, g / px, b / px);
  draw();
  if (meter.hr !== null) {
    setRing(1);
    hrEl.textContent = Math.round(meter.hr) + ' уд/мин';
    msgEl.textContent = 'Готово';
    stop();
  } else if (meter.failed) {
    setRing(0);
    msgEl.textContent = `Не удалось набрать ${MIN_RUN_SEC} с чистого сигнала. Держите палец неподвижно и попробуйте ещё раз`;
    stop();
  } else {
    setRing(meter.run / MIN_RUN_SEC);
    msgEl.textContent = `Чистый сигнал: ${meter.run.toFixed(1)} из ${MIN_RUN_SEC} с`;
    nextFrame();
  }
}

// Quality colour as in full_refine: red -> background -> green, TwoSlopeNorm(0.4*thr, thr, 1.5*thr)
function qualityColor(q, bg, bad, good) {
  const thr = meter.thr, lo = thr * 0.4, hi = thr * 1.5;
  q = Math.min(hi, Math.max(lo, q));
  const [from, to, a] = q < thr ? [bad, bg, (q - lo) / (thr - lo)] : [bg, good, (q - thr) / (hi - thr)];
  return `rgb(${from.map((c, i) => Math.round(c + (to[i] - c) * a)).join(',')})`;
}

function hexRgb(name) {
  const h = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = plot.clientWidth * dpr, h = plot.clientHeight * dpr;
  if (plot.width !== w || plot.height !== h) { plot.width = w; plot.height = h; }
  const ctx = plot.getContext('2d'), actx = aurora.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  actx.clearRect(0, 0, aurora.width, aurora.height);
  if (meter.b1 === null) return;
  const total = BUF_SEC * FS, [sig, smooth] = meter.plotSignals(), s0 = meter.n - sig.length;
  const x = i => w - (sig.length - i) * w / total;
  // Aurora: one low-res column per 1/64 of the plot, coloured by the quality of the sample under it
  const bg = hexRgb('--bg'), bad = hexRgb('--bad'), good = hexRgb('--good');
  for (let c = 0; c < aurora.width; c++) {
    const q = meter.quality(meter.n - total + Math.floor((c + 0.5) * total / aurora.width));
    if (!(q >= 0)) continue;  // NaN (not computed yet) or undefined (before the start)
    actx.fillStyle = qualityColor(q, bg, bad, good);
    actx.fillRect(c, 0, 1, aurora.height);
  }
  let min = Infinity, max = -Infinity;
  for (const v of sig) { min = Math.min(min, v); max = Math.max(max, v); }
  const y = v => h * 0.8 - (v - min) / (max - min || 1) * h * 0.6;
  const line = (data, color, width, alpha) => {
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = width * dpr;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    data.forEach((v, i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, x(i), y(v)));
    ctx.stroke();
    ctx.globalAlpha = 1;
  };
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name);
  line(sig, css('--muted'), 1, 0.45);
  line(smooth, css('--fg'), 4, 1);
}

startBtn.onclick = () => (stream ? stop() : start());
torchBtn.onclick = () => setTorch(!torchBtn.classList.contains('on'));
</script>
</body>
</html>
